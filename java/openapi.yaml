openapi: 3.0.3
info:
  title: XA Bank Time Deposits
  version: 1.0.0
  description: Exactly two operations for listing deposits and crediting one monthly interest increment.
servers:
  - url: http://{apiHost}:8080
    description: Local demo by default; set apiHost when the API runs elsewhere.
    variables:
      apiHost:
        default: localhost
        description: Hostname of the API server.
security: []
paths:
  /api/time-deposits:
    get:
      operationId: listTimeDeposits
      summary: List every time deposit with its withdrawals
      responses:
        '200':
          description: Deposits ordered by id; withdrawals ordered by id within each deposit.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDeposit'
  /api/time-deposits/update-balances:
    post:
      operationId: accrueAllBalances
      summary: Credit one monthly interest increment to every stored deposit
      description: >-
        Every request invokes the existing calculator once for every deposit. It does
        not change days and is not idempotent: a retry credits interest again.
        Withdrawals are historical records already reflected in the stored balance.
      responses:
        '204':
          description: All deposit balances were updated in one database transaction.
components:
  schemas:
    TimeDeposit:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
        planType:
          type: string
          example: basic
        balance:
          type: number
          multipleOf: 0.01
          example: 1000.83
        days:
          type: integer
          format: int32
          example: 45
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
        amount:
          type: number
          multipleOf: 0.01
          example: 25.00
        date:
          type: string
          format: date
          example: '2026-01-15'
