name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and validate API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Set up Node.js for OpenAPI validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check Docker for Testcontainers
        run: docker info

      - name: Build and run unit and PostgreSQL integration tests
        run: mvn --batch-mode --no-transfer-progress -f java/pom.xml clean verify

      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint java/openapi.yaml --config .redocly.yaml

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: java/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Deliver verified application JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: time-deposit-${{ github.sha }}
          path: java/target/time-deposit-kata-*.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
